<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#4f46e5" opacity="0.1"/>
  
  <!-- Wallet shape -->
  <rect x="25" y="35" width="50" height="35" rx="4" fill="#4f46e5"/>
  
  <!-- Wallet fold -->
  <path d="M 25 45 L 75 45" stroke="#fff" stroke-width="2" fill="none"/>
  
  <!-- Dollar sign -->
  <text x="50" y="60" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="middle">$</text>
  
  <!-- Accent line -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
</svg>